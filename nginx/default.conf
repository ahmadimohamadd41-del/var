# VAR VPN — nginx inside the web container
# TLS/دامنه توسط reverse-proxy هاست انجام می‌شود؛ اینجا فقط SPA سرو می‌شود.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # health check برای داکر و اسکریپت deploy
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # فاز ۲: وقتی سرویس api به compose اضافه شد، این مسیر فعال می‌شود
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # SPA fallback
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    # کش بلندمدت برای assetهای hashدار
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # فایل‌های حساس هرگز سرو نشوند
    location ~ /\. { deny all; }
}
